<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GLB Viewer — model-viewer</title>
<style>
  :root { --accent: #6ea8fe; }
  html, body { margin: 0; height: 100%; background: #1a1a24; color: #cfd3e0;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  #toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px; }
  button { background: #232a3d; color: #cfd3e0; border: 1px solid #3a455f;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.95rem; cursor: pointer; }
  button:hover { background: #2c3550; }
  model-viewer { width: 100vw; height: 100vh; background: #1a1a24; --poster-color: transparent; }
  #info { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: #232a3d99; padding: 6px 14px; border-radius: 8px;
    font-size: 0.85rem; color: #9aa3bd; }
  #drop-overlay { position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; background: #0008;
    opacity: 0; pointer-events: none; transition: opacity .15s; }
  #drop-overlay.active { opacity: 1; }
  #drop-overlay span { font-size: 1.4rem; color: var(--accent); font-weight: 600; }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="toolbar">
  <button id="btn-open">Open .glb</button>
  <button id="btn-reset">Reset View</button>
</div>
<input id="file-input" type="file" accept=".glb,.gltf" style="display:none" />

<model-viewer id="mv"
  camera-controls
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1"
  tone-mapping="aces"
  environment-image="neutral"
  min-field-of-view="5deg">
</model-viewer>

<div id="drop-overlay"><span>Drop .glb file here</span></div>
<div id="info">No model loaded — drag &amp; drop a .glb file or click Open</div>

<script type="module">
  const mv = document.getElementById('mv');
  const info = document.getElementById('info');
  const fileInput = document.getElementById('file-input');
  const dropOverlay = document.getElementById('drop-overlay');
  let objectUrl = null;

  function setSrc(url, label) {
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    mv.src = url;
    info.textContent = `Loading ${label}…`;
  }

  mv.addEventListener('load', () => {
    try {
      info.textContent = mv.src.startsWith('blob:')
        ? 'Loaded (local file)'
        : `Loaded ${mv.src}`;
    } catch { info.textContent = `Loaded`; }
  });
  mv.addEventListener('error', (e) => {
    info.textContent = 'Failed to load model';
    console.error('model-viewer error', e.detail);
  });

  function loadFile(file) {
    objectUrl = URL.createObjectURL(file);
    mv.src = objectUrl;
    info.textContent = `Loading ${file.name}…`;
  }

  document.getElementById('btn-open').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
  document.getElementById('btn-reset').addEventListener('click', () => {
    mv.cameraOrbit = '0deg 75deg 105%';
    mv.cameraTarget = 'auto auto auto';
    mv.fieldOfView = 'auto';
  });

  // Drag & drop
  document.addEventListener('dragover', e => { e.preventDefault(); dropOverlay.classList.add('active'); });
  document.addEventListener('dragleave', e => { e.preventDefault(); dropOverlay.classList.remove('active'); });
  document.addEventListener('drop', e => {
    e.preventDefault(); dropOverlay.classList.remove('active');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  // Auto-load from ?model= URL param
  const urlModel = new URLSearchParams(location.search).get('model');
  if (urlModel) setSrc(urlModel, urlModel);
</script>
</body>
</html>
